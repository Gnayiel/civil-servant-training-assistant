name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 静态检查与自检
        run: node tools/ci.mjs --no-smoke

      - name: 页面冒烟（有浏览器时必须通过）
        run: node tests/page-smoke.mjs --require-browser
