name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验版本号与脚本头一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEAD_VER=$(grep -m1 '@version' civil-servant-training-assistant.user.js | awk '{print $3}')
          if [ "$TAG" != "$HEAD_VER" ]; then
            echo "tag $TAG 与 @version $HEAD_VER 不一致"; exit 1
          fi

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: civil-servant-training-assistant.user.js
          generate_release_notes: true
